name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            asset_suffix: darwin-amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            asset_suffix: darwin-arm64
            ext: ""
          - goos: linux
            goarch: amd64
            asset_suffix: linux-amd64
            ext: ""
          - goos: windows
            goarch: amd64
            asset_suffix: windows-amd64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          OUTPUT="dist/cr3_${VERSION}_${{ matrix.asset_suffix }}${{ matrix.ext }}"

          make build \
            VERSION="${VERSION}" \
            OUT="${OUTPUT}" \
            GOOS="${{ matrix.goos }}" \
            GOARCH="${{ matrix.goarch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset_suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true

      - name: Generate Homebrew/Scoop manifests
        run: |
          set -euo pipefail
          chmod +x scripts/generate-packaging.sh
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/generate-packaging.sh "${VERSION}"

      - name: Upload packaging manifests
        uses: actions/upload-artifact@v4
        with:
          name: packaging-manifests-${{ github.ref_name }}
          path: packaging/generated/*
          if-no-files-found: error

      - name: Publish Homebrew manifest to external repo
        if: ${{ env.PACKAGING_PUSH_TOKEN != '' }}
        env:
          PACKAGING_PUSH_TOKEN: ${{ secrets.PACKAGING_PUSH_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'gobbi9/tap' }}
        run: |
          set -euo pipefail
          chmod +x scripts/publish-packaging-manifest.sh
          ./scripts/publish-packaging-manifest.sh \
            "${HOMEBREW_TAP_REPO}" \
            "packaging/generated/cr3-keywords.rb" \
            "Formula/cr3-keywords.rb" \
            "Homebrew formula" \
            "Update cr3-keywords formula for ${GITHUB_REF_NAME}"

      - name: Publish Scoop manifest to external repo
        if: ${{ env.PACKAGING_PUSH_TOKEN != '' }}
        env:
          PACKAGING_PUSH_TOKEN: ${{ secrets.PACKAGING_PUSH_TOKEN }}
          SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO || 'gobbi9/scoop-bucket' }}
        run: |
          set -euo pipefail
          chmod +x scripts/publish-packaging-manifest.sh
          ./scripts/publish-packaging-manifest.sh \
            "${SCOOP_BUCKET_REPO}" \
            "packaging/generated/cr3-keywords.json" \
            "cr3-keywords.json" \
            "Scoop manifest" \
            "Update cr3-keywords manifest for ${GITHUB_REF_NAME}"
