name: Release binaries

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - goos: darwin
                      goarch: amd64
                      asset_suffix: darwin-amd64
                      ext: ""
                    - goos: darwin
                      goarch: arm64
                      asset_suffix: darwin-arm64
                      ext: ""
                    - goos: linux
                      goarch: amd64
                      asset_suffix: linux-amd64
                      ext: ""
                    - goos: windows
                      goarch: amd64
                      asset_suffix: windows-amd64
                      ext: ".exe"

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Build binary
              run: |
                  set -euo pipefail

                  VERSION="${GITHUB_REF_NAME#v}"
                  OUTPUT="dist/cr3_${VERSION}_${{ matrix.asset_suffix }}${{ matrix.ext }}"

                  make build \
                    VERSION="${VERSION}" \
                    OUT="${OUTPUT}" \
                    GOOS="${{ matrix.goos }}" \
                    GOARCH="${{ matrix.goarch }}"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: binary-${{ matrix.asset_suffix }}
                  path: dist/*
                  if-no-files-found: error

    release:
        name: Publish GitHub release
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download built binaries
              uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            - name: Publish release assets
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  files: dist/*
                  generate_release_notes: true

            - name: Generate Homebrew/Scoop manifests
              run: |
                  set -euo pipefail
                  chmod +x scripts/generate-packaging.sh
                  VERSION="${GITHUB_REF_NAME#v}"
                  ./scripts/generate-packaging.sh "${VERSION}"

            - name: Upload packaging manifests
              uses: actions/upload-artifact@v4
              with:
                  name: packaging-manifests-${{ github.ref_name }}
                  path: packaging/generated/*
                  if-no-files-found: error

            - name: Publish Homebrew/Scoop manifests to external repos
              if: ${{ secrets.PACKAGING_PUSH_TOKEN != '' }}
              env:
                  PACKAGING_PUSH_TOKEN: ${{ secrets.PACKAGING_PUSH_TOKEN }}
                  HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'gobbi9/tap' }}
                  SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO || 'gobbi9/scoop-bucket' }}
              run: |
                  set -euo pipefail

                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  WORK_DIR="$(mktemp -d)"
                  trap 'rm -rf "$WORK_DIR"' EXIT

                  echo "Publishing Homebrew formula to ${HOMEBREW_TAP_REPO}"
                  git clone "https://x-access-token:${PACKAGING_PUSH_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" "${WORK_DIR}/homebrew-tap"
                  mkdir -p "${WORK_DIR}/homebrew-tap/Formula"
                  cp packaging/generated/cr3-keywords.rb "${WORK_DIR}/homebrew-tap/Formula/cr3-keywords.rb"

                  (
                    cd "${WORK_DIR}/homebrew-tap"
                    if git diff --quiet -- Formula/cr3-keywords.rb; then
                      echo "No Homebrew formula changes to commit."
                    else
                      git add Formula/cr3-keywords.rb
                      git commit -m "chore: update cr3-keywords formula for ${GITHUB_REF_NAME}"
                      git push
                    fi
                  )

                  echo "Publishing Scoop manifest to ${SCOOP_BUCKET_REPO}"
                  git clone "https://x-access-token:${PACKAGING_PUSH_TOKEN}@github.com/${SCOOP_BUCKET_REPO}.git" "${WORK_DIR}/scoop-bucket"
                  cp packaging/generated/cr3-keywords.json "${WORK_DIR}/scoop-bucket/cr3-keywords.json"

                  (
                    cd "${WORK_DIR}/scoop-bucket"
                    if git diff --quiet -- cr3-keywords.json; then
                      echo "No Scoop manifest changes to commit."
                    else
                      git add cr3-keywords.json
                      git commit -m "chore: update cr3-keywords manifest for ${GITHUB_REF_NAME}"
                      git push
                    fi
                  )
