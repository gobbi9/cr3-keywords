name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            asset_suffix: darwin-amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            asset_suffix: darwin-arm64
            ext: ""
          - goos: linux
            goarch: amd64
            asset_suffix: linux-amd64
            ext: ""
          - goos: windows
            goarch: amd64
            asset_suffix: windows-amd64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build binary
        run: |
          set -euo pipefail
          uv run scripts/build_binary.py \
            --goos "${{ matrix.goos }}" \
            --goarch "${{ matrix.goarch }}" \
            --asset-suffix "${{ matrix.asset_suffix }}" \
            --ext "${{ matrix.ext }}" \
            --version "${GITHUB_REF_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset_suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true

      - name: Generate Homebrew/Scoop manifests
        run: |
          set -euo pipefail
          uv run scripts/generate_packaging.py --version "${GITHUB_REF_NAME}"

      - name: Upload packaging manifests
        uses: actions/upload-artifact@v4
        with:
          name: packaging-manifests-${{ github.ref_name }}
          path: packaging/generated/*
          if-no-files-found: error

      - name: Publish Homebrew manifest to external repo
        if: ${{ env.PACKAGING_PUSH_TOKEN != '' }}
        env:
          PACKAGING_PUSH_TOKEN: ${{ secrets.PACKAGING_PUSH_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'gobbi9/tap' }}
        run: |
          set -euo pipefail
          uv run scripts/publish_packaging_manifest.py \
            --target-repo "${HOMEBREW_TAP_REPO}" \
            --source-file "packaging/generated/cr3-keywords.rb" \
            --target-file "Formula/cr3-keywords.rb" \
            --display-name "Homebrew formula" \
            --commit-message "Update cr3-keywords formula for ${GITHUB_REF_NAME}"

      - name: Publish Scoop manifest to external repo
        if: ${{ env.PACKAGING_PUSH_TOKEN != '' }}
        env:
          PACKAGING_PUSH_TOKEN: ${{ secrets.PACKAGING_PUSH_TOKEN }}
          SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO || 'gobbi9/scoop-bucket' }}
        run: |
          set -euo pipefail
          uv run scripts/publish_packaging_manifest.py \
            --target-repo "${SCOOP_BUCKET_REPO}" \
            --source-file "packaging/generated/cr3-keywords.json" \
            --target-file "cr3-keywords.json" \
            --display-name "Scoop manifest" \
            --commit-message "Update cr3-keywords manifest for ${GITHUB_REF_NAME}"
